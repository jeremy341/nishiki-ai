<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>Nishiki: home (mockup)</title>
  <link rel="stylesheet" href="mock.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body data-theme="paper">
  <div class="phone">
    <canvas id="pond" aria-hidden="true"></canvas>

    <div class="layer">
      <div class="status"></div>
      <header class="bar">
        <button class="icon-btn" id="hb-menu" aria-label="Chats öffnen"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h10"/></svg></button>
        <button class="icon-btn" id="hb-new" aria-label="Neuer Chat"><svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a1.7 1.7 0 0 1 2.4 2.4L12 14.8 8.5 15.5l.7-3.5z"/></svg></button>
      </header>

      <main class="home">
        <div class="orb-wrap" id="orbwrap">
          <svg class="ring" id="ring" aria-hidden="true"></svg>
          <button class="orb-btn" id="orbbtn" aria-label="Sprechen"><svg id="orb" aria-hidden="true"></svg></button>
        </div>
        <p class="caption hint" id="hint">tippe auf die kugel, um zu sprechen</p>

        <section class="words" id="words">
          <h1 class="greet"><span>Guten Abend,</span><span class="l2">Jeremy.</span></h1>
          <svg class="wave" viewBox="0 0 72 8" aria-hidden="true"><path d="M1 4c4.5-4.6 8.5-4.6 13 0s8.5 4.6 13 0 8.5-4.6 13 0 8.5 4.6 13 0 8.5-4.6 13 0"/></svg>
          <button class="caption today" id="today">18:30 zahnarzt · 2 erinnerungen · 8° bewölkt</button>
        </section>
      </main>

      <div class="dock" id="dock">
        <button class="plus" aria-label="Anhängen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="pill"><span>Frag mich etwas</span>
          <div class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
        </div>
        <button class="voice" aria-label="Sprachmodus"><svg id="mini" aria-hidden="true"></svg></button>
      </div>
    </div>
  </div>

  <script src="pond-multi.js"></script>
  <script src="mock.js"></script>
  <script src="home.js"></script>
</body>
</html>
